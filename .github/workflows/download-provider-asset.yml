name: "[Get Assets] By Provider"
run-name: "${{ inputs.source }}: ${{ inputs.id || inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Image provider'
        required: true
        type: choice
        options:
          - coingecko
          - coinmarketcap
          - jupiter
          - dexscreener
      id:
        description: 'Optional provider ID or comma-separated IDs (DexScreener: chain_token-address)'
        required: false
        type: string
      mode:
        description: 'List selection when no ID is provided'
        required: true
        type: choice
        default: top
        options:
          - top
          - trending

permissions:
  contents: write

concurrency:
  group: download-provider-asset-${{ inputs.source }}-${{ inputs.id || inputs.mode }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.download.outputs.has_changes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/download-assets
        id: download
        with:
          source: ${{ inputs.source }}
          id: ${{ inputs.id }}
          mode: ${{ inputs.mode }}
        env:
          COINGECKO_KEY_SECRET: ${{ secrets.COINGECKO_KEY_SECRET }}
          COINMARKETCAP_KEY_SECRET: ${{ secrets.COINMARKETCAP_KEY_SECRET }}
          COINGECKO_TOP_COUNT: ${{ vars.COINGECKO_TOP_COUNT }}
          COINMARKETCAP_TOP_COUNT: ${{ vars.COINMARKETCAP_TOP_COUNT }}
          COINMARKETCAP_TRENDING_COUNT: ${{ vars.COINMARKETCAP_TRENDING_COUNT }}
          JUPITER_TOP_COUNT: ${{ vars.JUPITER_TOP_COUNT }}

  publish:
    needs: download
    if: needs.download.outputs.has_changes == 'true'
    uses: ./.github/workflows/upload.yml
    secrets: inherit

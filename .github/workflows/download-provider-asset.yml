name: Download Provider Asset
run-name: "${{ inputs.source }}: ${{ inputs.id || inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Image provider'
        required: true
        type: choice
        options:
          - coingecko
          - coinmarketcap
          - jupiter
          - dexscreener
      id:
        description: 'Optional provider ID or comma-separated IDs (DexScreener: chain_token-address)'
        required: false
        type: string
      mode:
        description: 'List selection when no ID is provided'
        required: true
        type: choice
        default: top
        options:
          - top
          - trending

permissions:
  contents: write

concurrency:
  group: download-provider-asset-${{ inputs.source }}-${{ inputs.id || inputs.mode }}
  cancel-in-progress: false

jobs:
  download:
    uses: ./.github/workflows/download-assets.yml
    with:
      source: ${{ inputs.source }}
      id: ${{ inputs.id }}
      mode: ${{ inputs.mode }}
    secrets: inherit

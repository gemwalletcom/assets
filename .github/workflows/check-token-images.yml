name: "[CI] Check Token Images"

on:
  pull_request:
    paths:
      - 'blockchains/**/logo.png'
      - 'scripts/check_token_images.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/check-token-images.yml'
  push:
    branches:
      - master
    paths:
      - 'blockchains/**/logo.png'
      - 'scripts/check_token_images.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/check-token-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-token-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Check token images
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_token_images.py 2>&1 | tee token-image-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-image-report
          path: token-image-report.txt
          if-no-files-found: error

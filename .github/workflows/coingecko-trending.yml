name: CoinGecko Trending Assets
run-name: "CoinGecko trending assets"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: coingecko-trending
  cancel-in-progress: false

jobs:
  download:
    uses: ./.github/workflows/download-assets.yml
    with:
      source: coingecko
      mode: trending
    secrets: inherit

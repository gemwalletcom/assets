name: "[CI] Publish Assets"

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: read

concurrency:
  group: upload
  cancel-in-progress: false

env:
  RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_SECRET_KEY }}
  R2_ASSETS_BUCKET: ${{ secrets.R2_ASSETS_BUCKET }}
  R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref_name }}

      - name: Install rclone
        env:
          RCLONE_VERSION: v1.75.2
          RCLONE_SHA256: efbfe852181f7191eb3c9043ed1ab49c9b2d0ba045c61c926a5da111c939ec5c
        run: |
          curl -fsSLo "$RUNNER_TEMP/rclone.deb" "https://github.com/rclone/rclone/releases/download/$RCLONE_VERSION/rclone-$RCLONE_VERSION-linux-amd64.deb"
          echo "$RCLONE_SHA256  $RUNNER_TEMP/rclone.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/rclone.deb"

      - name: Sync blockchains to R2
        uses: ./.github/actions/sync-r2
        with:
          directory: blockchains
          changes: ${{ runner.temp }}/changed.txt

      - name: Sync lists to R2
        uses: ./.github/actions/sync-r2
        with:
          directory: lists
          changes: ${{ runner.temp }}/changed.txt

      - name: Purge cache
        run: ./.github/scripts/purge-cache.sh "${{ secrets.R2_PURGE_CACHE_ZONE_ID }}" "${{ secrets.R2_PURGE_CACHE_SECRET_KEY }}" "${{ secrets.R2_PURGE_CACHE_URL }}" "$RUNNER_TEMP/changed.txt"

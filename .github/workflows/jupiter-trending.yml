name: Jupiter Trending Assets
run-name: "Jupiter trending assets"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

concurrency:
  group: jupiter-trending
  cancel-in-progress: false

jobs:
  download:
    uses: ./.github/workflows/download-assets.yml
    with:
      source: jupiter
      mode: trending
    secrets: inherit

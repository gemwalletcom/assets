name: Jupiter Assets
run-name: "Jupiter: verified tokens"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: jupiter
  cancel-in-progress: false

jobs:
  download:
    uses: ./.github/workflows/download-assets.yml
    with:
      source: jupiter
    secrets: inherit

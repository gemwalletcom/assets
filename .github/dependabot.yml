version: 2
updates:
  # Major versions only. A 0.x release breaks on its minor bump (0.0.x on its patch), so those ignore less.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "Swatinem/rust-cache"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # The wallet crates follow every wallet release tag; the rest take major versions only.
  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      wallet:
        patterns:
          - "chain_primitives"
          - "chain_traits"
          - "coingecko"
          - "coinmarketcap"
          - "dexscreener"
          - "gem_client"
          - "gem_hypercore"
          - "jupiter"
          - "primitives"
          - "serde_serializers"
    ignore:
      - dependency-name: "oxipng"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "serde_json"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "tokio"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "async-trait"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "image"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "resvg"
        update-types: ["version-update:semver-patch"]

name: Set up Rust
description: Restore the cli crate build cache; rustup installs the toolchain pinned in cli/rust-toolchain.toml
runs:
  using: composite
  steps:
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: cli -> target
